# 개발용 yaml 파일


server:
    error:
        include-stacktrace: always
        include-message: always

spring:
    application:
        name: msa4meerkatgram
    servlet:
      multipart:
          max-file-size: 10MB
          max-request-size: 20MB

    # DB
    datasource:
        url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:meerkatgram}
        username: ${DB_USER:root}
        password: ${DB_PASSWORD:msa505}
        driver-class-name: com.mysql.cj.jdbc.Driver
        #커넥션 풀 설정
        hikari:
            maximum-pool-size: 10
            connection-timeout: 30000

    # jpa 관련 설정
    jpa:
        hibernate:
            # 서버를 재시작 할때, DB 스키마를 어떻게 관리할지 설정
            # none 이외의 설정값을 사용시, DB 스키마가 초기화 되거나 수정되므로 주의
            ddl-auto: none
        # 실행되는 SQL을 콘솔에 출력 여부를 출력함
        show-sql: true
        properties:
            hibernate:
                # SQL을 보기좋게 포맷하여 출력
                format_sql: true

        # 데이터 소스 초기화 지연설정
        # true 로 설정시, Spring 컨텍스트가 완전히 로드된 후에, 어플리케이션의 DataSource 초기화
        defer-datasource-initialization: true
    sql:
        init:
            # DataBase 초기화 파일의 위치 설정
            data-locations: classpath*:dummy/*.sql
            # DB 초기화 파일이 실행될 시점을 설정(상황에따라 모드를 조정해서 써야함)
            # embedded 는 로컬환경일때 실행, never는 실행하지 않는다 라는뜻
            mode: never
            # 사용할 DB 플랫폼 설정하는 값 (원래는 명확하게 해줘야함) ALL은 모든 DB플랫폼 사용가능하게 하겠다.
            platform: all


# Mybatis      
mybatis:
    mapper-locations: classpath:mapper/**/*Mapper.xml
    type-aliases-package: com.msa4meerkatgram
# Log
logging:
    file:
        # 로그 파일 경로
        name: logs/error.log
    level:
        # 로그 출력시 레벨 설정(trace, debug, info, warn, error)
        root: info
        
        # 특정 패키지만 로그 출력 레벨 설정
        com.msa4meerkatgram.controllers: debug
# Security & JWT
security:
    jwt:
        secure: false
        issuer: meerkat@meerkat.kr
        type: JWT
        access-token-expiry: 100000000
        refresh-token-expiry: 1296000000
        refresh-token-cookie-name: refresh-token
        refresh-token-cookie-expiry: 1296000
        secret: w4e5gwe57nhwb456g3h46g34of6h9439f5h8o7os5789hflsg645eh74s57he54g734
        header-key: Authorization
        scheme: Bearer
        reiss-uri: /api/reissue-token

# config
file:
    server-uri: http://localhost:8080
    storage-path: E:/MSA4_YoonSeok/workspace/msa4-meerkatgram/storage
    profile-path: /files/profiles
    post-path: /files/posts
    allow-extension-list: [
        "image/jpeg",
        "image/jpg",
        "image/png",
        "image/gif",
        "image/svg",
        "image/webp"
        
    ]

cors:
    allowed-origins: ["http://localhost:5173"]
    max-age: 3600

